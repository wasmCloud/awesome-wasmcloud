[package]
name = "temporal-example"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "An example workload for the wasmCloud Temporal plugin: runs Temporal activities."
publish = false

# Keeps this crate its own workspace, apart from the plugin's.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = "1"
serde_json = "1"
wit-bindgen = { version = "0.60", features = ["async-spawn", "inter-task-wakeup"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
