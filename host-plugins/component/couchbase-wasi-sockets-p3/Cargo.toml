[package]
name = "couchbase-wasi-sockets-p3-plugin"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
name = "couchbase_wasi_sockets_p3_plugin"

[dependencies]
wit-bindgen = { version = "0.63.0", features = ["async-spawn", "inter-task-wakeup"] }
serde_json = "1.0"

[features]
# The TLS draft requires a host release containing wasmCloud PR #6014.
tls = []

[profile.release]
opt-level = "s"

[workspace]
