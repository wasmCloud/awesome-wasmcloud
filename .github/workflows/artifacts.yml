name: Publish artifacts

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '*-v*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: artifacts-${{ github.event_name == 'pull_request' && github.ref || 'publication' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUSTUP_TOOLCHAIN: stable
  WASH_VERSION: v2.12.2
  WASM_TOOLS_VERSION: 1.262.0

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      wit: ${{ steps.plan.outputs.wit }}
      components: ${{ steps.plan.outputs.components }}
      has_artifacts: ${{ steps.plan.outputs.has_artifacts }}
      has_wit: ${{ steps.plan.outputs.has_wit }}
      has_components: ${{ steps.plan.outputs.has_components }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Test release helpers
        run: node --test .github/scripts/*.test.mjs
      - name: Select registered artifacts
        id: plan
        run: node .github/scripts/plan-artifacts.mjs

  build:
    needs: plan
    if: needs.plan.outputs.has_artifacts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: wasmCloud/setup-wash-action@47756fa211cc82f392c57e39504f43ef46fc0b3e # v2.1.0
        with:
          wash-version: ${{ env.WASH_VERSION }}
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
        with:
          version: ${{ env.WASM_TOOLS_VERSION }}
      - name: Install stable Rust and Wasm target
        if: matrix.kind == 'component'
        run: rustup toolchain install stable --profile minimal --target wasm32-wasip2
      - name: Build, test and validate artifact
        env:
          ARTIFACT: ${{ matrix.id }}
        run: node .github/scripts/build-artifact.mjs "$ARTIFACT"
      - name: Check published contract
        if: matrix.kind == 'wit'
        env:
          ARTIFACT: ${{ matrix.id }}
        run: node .github/scripts/publish-artifact.mjs check "$ARTIFACT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-${{ matrix.id }}
          path: dist/${{ matrix.id }}.wasm
          if-no-files-found: error

  publish-wit:
    needs:
      - plan
      - build
    if: >-
      github.repository == 'wasmCloud/awesome-wasmcloud' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) &&
      needs.plan.outputs.has_wit == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.wit) }}
    uses: ./.github/workflows/publish-artifact.yml
    with:
      artifact: ${{ matrix.id }}

  publish-components:
    needs:
      - plan
      - build
      - publish-wit
    if: >-
      always() && !cancelled() &&
      github.repository == 'wasmCloud/awesome-wasmcloud' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) &&
      needs.plan.result == 'success' && needs.build.result == 'success' &&
      (needs.publish-wit.result == 'success' || needs.publish-wit.result == 'skipped') &&
      needs.plan.outputs.has_components == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.components) }}
    uses: ./.github/workflows/publish-artifact.yml
    with:
      artifact: ${{ matrix.id }}
