name: Component regression tests

on:
  pull_request:
    paths:
      - components/grpc-client/**
      - host-plugins/component/couchbase/**
      - host-plugins/component/couchbase-wasi-sockets-p3/**
      - host-plugins/component/tls-client/**
      - tests/**
      - .github/workflows/components.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install pinned Rust
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Run native protocol and stream regressions
        run: |
          cargo +1.96.0 test --locked --manifest-path components/grpc-client/Cargo.toml
          cargo +1.96.0 test --locked --manifest-path host-plugins/component/couchbase/Cargo.toml
          cargo +1.96.0 test --locked --manifest-path host-plugins/component/couchbase-wasi-sockets-p3/Cargo.toml
          cargo +1.96.0 test --locked --manifest-path host-plugins/component/tls-client/Cargo.toml
      - name: Test verification runners
        run: |
          node --check tests/verify-components.mjs
          node --check tests/component-build.mjs
          node --check tests/fixtures/server.js
          node --check host-plugins/component/tls-client/verification/run.mjs
          node --input-type=module -e "await import('./tests/verify-components.mjs'); await import('./host-plugins/component/tls-client/verification/run.mjs')"
          node --test tests/verify-components.test.mjs
