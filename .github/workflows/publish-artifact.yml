name: Publish one artifact

on:
  workflow_call:
    inputs:
      artifact:
        description: Artifact id from .github/artifacts.json
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      WASH_VERSION: v2.12.2
      WASM_TOOLS_VERSION: 1.262.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifact-${{ inputs.artifact }}
          path: dist
      - uses: wasmCloud/setup-wash-action@47756fa211cc82f392c57e39504f43ef46fc0b3e # v2.1.0
        with:
          wash-version: ${{ env.WASH_VERSION }}
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
        with:
          version: ${{ env.WASM_TOOLS_VERSION }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable artifact
        id: publish
        env:
          ARTIFACT: ${{ inputs.artifact }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/publish-artifact.mjs publish "$ARTIFACT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.publish.outputs.attest == 'true'
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Verify anonymous pull
        env:
          ARTIFACT: ${{ inputs.artifact }}
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
        run: node .github/scripts/publish-artifact.mjs verify "$ARTIFACT"
      - name: Verify published provenance
        env:
          ARTIFACT: ${{ inputs.artifact }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.publish.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          NEW_ATTESTATION: ${{ steps.publish.outputs.attest }}
        run: node .github/scripts/verify-attestation.mjs "$ARTIFACT"
