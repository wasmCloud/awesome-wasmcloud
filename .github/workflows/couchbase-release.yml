name: Publish Couchbase

on:
  pull_request:
    paths:
      - host-plugins/component/couchbase/**
      - host-plugins/component/couchbase-wasi-sockets-p3/**
      - wit-deps/**
      - .github/scripts/**
      - .github/workflows/couchbase-release.yml
  push:
    branches:
      - main
    tags:
      - couchbase-v*
    paths:
      - host-plugins/component/couchbase/**
      - host-plugins/component/couchbase-wasi-sockets-p3/**
      - wit-deps/**
      - .github/scripts/**
      - .github/workflows/couchbase-release.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: couchbase-release-${{ github.event_name == 'pull_request' && github.ref || 'publication' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUSTUP_TOOLCHAIN: stable
  WASH_VERSION: v2.12.2
  WASM_TOOLS_VERSION: 1.262.0

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Test release helpers
        run: node --test .github/scripts/*.test.mjs
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Test both transports and TLS
        run: |
          cargo test --locked --manifest-path host-plugins/component/couchbase/Cargo.toml
          cargo test --locked --manifest-path host-plugins/component/couchbase-wasi-sockets-p3/Cargo.toml
          cargo test --locked --features tls --manifest-path host-plugins/component/couchbase-wasi-sockets-p3/Cargo.toml

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        artifact:
          - wit
          - http
          - sockets
          - tls
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: wasmCloud/setup-wash-action@47756fa211cc82f392c57e39504f43ef46fc0b3e # v2.1.0
        with:
          wash-version: ${{ env.WASH_VERSION }}
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
        with:
          version: ${{ env.WASM_TOOLS_VERSION }}
      - name: Install stable Rust and Wasm target
        if: matrix.artifact != 'wit'
        run: rustup toolchain install stable --profile minimal --target wasm32-wasip2
      - name: Build and validate artifact
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: node .github/scripts/build-couchbase-release.mjs "$ARTIFACT"
      - name: Check published contract before releasing components
        if: matrix.artifact == 'wit'
        run: node .github/scripts/publish-couchbase-release.mjs check wit
      - name: Check dependency locks
        run: git diff --exit-code -- '**/Cargo.lock' '**/wkg.lock'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: couchbase-${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.wasm
          if-no-files-found: error

  publish:
    needs:
      - test
      - build
    if: >-
      github.repository == 'wasmCloud/awesome-wasmcloud' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/couchbase-v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: couchbase-publish-${{ matrix.artifact }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        artifact:
          - wit
          - http
          - sockets
          - tls
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: couchbase-${{ matrix.artifact }}
          path: dist
      - uses: wasmCloud/setup-wash-action@47756fa211cc82f392c57e39504f43ef46fc0b3e # v2.1.0
        with:
          wash-version: ${{ env.WASH_VERSION }}
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
        with:
          version: ${{ env.WASM_TOOLS_VERSION }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable artifact
        id: publish
        env:
          ARTIFACT: ${{ matrix.artifact }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/publish-couchbase-release.mjs publish "$ARTIFACT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.publish.outputs.attest == 'true'
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Verify anonymous pull
        env:
          ARTIFACT: ${{ matrix.artifact }}
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
        run: node .github/scripts/publish-couchbase-release.mjs verify "$ARTIFACT"
